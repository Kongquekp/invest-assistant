name: Daily Scan
on:
  schedule:
    - cron: '40 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install akshare requests pandas
      - run: python main.py scan
      - if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'scan'
          file_pattern: 'data/*'
