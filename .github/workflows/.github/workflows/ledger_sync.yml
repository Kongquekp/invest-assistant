name: Ledger Sync
on:
  issues:
    types: [closed, reopened, labeled]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install akshare requests pandas
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py ledger
      - if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'ledger'
          file_pattern: 'data/* docs/*'
